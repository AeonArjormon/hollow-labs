&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    }

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

    }

  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);

    }
    if (fileElement != null) {

      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {

      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }

        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {

      return;
    }

        id = decodeURIComponent(href.slice(1));

      });
      return;
    }

  });

.8秒内首次蓄力攻击可更快开始蓄力，起手缩短10%；仍需完整蓄力时间和灵力，不增加空中次数。&quot;,&quot;tags&quot;:[&quot;蓄力衔接&quot;,&quot;共享冲刺&quot;]},&quot;companion&quot;:{&quot;name&quot;:&quot;墨坛灵豕&quot;,&quot;description&quot;:&quot;灵豕每4秒随主人有效施术生成最大生命5%的护盾，持续2秒；不叠同源、遵守总25%上限，冷却跨侧保留，不提供治疗。&quot;,&quot;tags&quot;:[&quot;主灵契&quot;,&quot;施术护盾&quot;]},&quot;resource&quot;:{&quot;name&quot;:&quot;敛息待发&quot;,&quot;description&quot;:&quot;精准闪避后2秒内首个直接命中返还8灵力，间隔2秒；同一攻击只能兑现一次，附伤不计，留存条件在切面时失效。&quot;,&quot;tags&quot;:[&quot;闪避反击&quot;,&quot;条件回灵&quot;]},&quot;affliction&quot;:{&quot;name&quot;:&quot;沉锋破甲&quot;,&quot;description&quot;:&quot;主攻击连段末尾或蓄力释放命中时额外增加破势，间隔1.5秒；同一次重击只触发一次，不让持续伤害或灵契重复触发。&quot;,&quot;tags&quot;:[&quot;蓄力联动&quot;,&quot;破势&quot;]}}}]}&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;liangyi-rune-workbench&#x27;);
  const catalog = JSON.parse(document.getElementById(&#x27;liangyi-rune-catalog&#x27;).textContent);
  const runes = new Map(catalog.runes.map(rune =&gt; [rune.id, rune]));
  const roles = [
    { id: &#x27;weapon&#x27;, name: &#x27;阿修罗道&#x27;, label: &#x27;武器 · J&#x27; },
    { id: &#x27;skill&#x27;, name: &#x27;天道&#x27;, label: &#x27;术法 · U&#x27; },
    { id: &#x27;mobility&#x27;, name: &#x27;人间道&#x27;, label: &#x27;身法&#x27; },
    { id: &#x27;companion&#x27;, name: &#x27;畜生道&#x27;, label: &#x27;灵契&#x27; },
    { id: &#x27;resource&#x27;, name: &#x27;饿鬼道&#x27;, label: &#x27;续航&#x27; },
    { id: &#x27;affliction&#x27;, name: &#x27;地狱道&#x27;, label: &#x27;附效&#x27; }
  ];
  const presets = {
    moon: { yang: [&#x27;rabbit&#x27;,&#x27;goat&#x27;,&#x27;horse&#x27;,&#x27;dog&#x27;,&#x27;rat&#x27;,&#x27;snake&#x27;], yin: [&#x27;snake&#x27;,&#x27;rooster&#x27;,&#x27;rabbit&#x27;,&#x27;monkey&#x27;,&#x27;pig&#x27;,&#x27;tiger&#x27;] },
    rider: { yang: [&#x27;horse&#x27;,&#x27;ox&#x27;,&#x27;monkey&#x27;,&#x27;dog&#x27;,&#x27;rat&#x27;,&#x27;dragon&#x27;], yin: [&#x27;rooster&#x27;,&#x27;rabbit&#x27;,&#x27;horse&#x27;,&#x27;goat&#x27;,&#x27;pig&#x27;,&#x27;snake&#x27;] },
    guard: { yang: [&#x27;ox&#x27;,&#x27;goat&#x27;,&#x27;rabbit&#x27;,&#x27;dog&#x27;,&#x27;pig&#x27;,&#x27;tiger&#x27;], yin: [&#x27;pig&#x27;,&#x27;dragon&#x27;,&#x27;horse&#x27;,&#x27;monkey&#x27;,&#x27;rat&#x27;,&#x27;snake&#x27;] }
  };
  const sideNames = { yang: &#x27;阳&#x27;, yin: &#x27;阴&#x27; };
  const defaults = {
    weapon: { yang: [&#x27;基础飞剑&#x27;,&#x27;直线远攻，按住 J 连续攻击。&#x27;], yin: [&#x27;基础剑斩&#x27;,&#x27;近身剑斩，按住 J 连续攻击。&#x27;] },
    skill: { yang: [&#x27;玉清护体&#x27;,&#x27;消耗灵力，提供护盾并发射贯虹飞剑。&#x27;], yin: [&#x27;镇魂突袭&#x27;,&#x27;消耗灵力，向前突进并扩大斩击。&#x27;] },
    mobility: { yang: [&#x27;基础身法&#x27;,&#x27;保留完整的冲刺、轻重跳和二段跳。&#x27;], yin: [&#x27;基础身法&#x27;,&#x27;保留完整的冲刺、轻重跳和二段跳。&#x27;] },
    companion: { yang: [&#x27;无灵契&#x27;,&#x27;此槽未装备主伴随灵体。&#x27;], yin: [&#x27;无灵契&#x27;,&#x27;此槽未装备主伴随灵体。&#x27;] },
    resource: { yang: [&#x27;自然恢复&#x27;,&#x27;保留基础灵力恢复，不额外触发回灵。&#x27;], yin: [&#x27;自然恢复&#x27;,&#x27;保留基础灵力恢复，不额外触发回灵。&#x27;] },
    affliction: { yang: [&#x27;无附效&#x27;,&#x27;直接攻击保留武器原有特性。&#x27;], yin: [&#x27;无附效&#x27;,&#x27;直接攻击保留武器原有特性。&#x27;] }
  };
  const element = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  const cloneLoadout = loadout =&gt; ({ yang: [...loadout.yang], yin: [...loadout.yin] });
  const buttons = { yang: [], yin: [] };
  const faces = { yang: element(&#x27;rune-face-yang&#x27;), yin: element(&#x27;rune-face-yin&#x27;) };
  const dial = element(&#x27;rune-dial&#x27;);
  const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  let state = { preset: &#x27;moon&#x27;, loadout: cloneLoadout(presets.moon), active: &#x27;yang&#x27;, selectedIndex: 0, drafts: {} };
  let flipping = false;
  let flipTimer;
  const draftKey = () =&gt; `${state.active}:${state.selectedIndex}`;
  const currentId = () =&gt; state.loadout[state.active][state.selectedIndex];
  const candidateId = () =&gt; Object.hasOwn(state.drafts, draftKey()) ? state.drafts[draftKey()] : currentId();

  function applySaved(saved) {
    const content = saved &amp;&amp; saved.modelContent;
    const ui = saved &amp;&amp; saved.privateContent;
    if (!content || content.version !== 1 || !content.loadout) return false;
    const next = {};
    for (const side of [&#x27;yang&#x27;,&#x27;yin&#x27;]) {
      const values = content.loadout[side];
      if (!Array.isArray(values) || values.length !== 6 || values.some(value =&gt; value !== null &amp;&amp; !runes.has(value))) return false;
      const equipped = values.filter(Boolean);
      if (new Set(equipped).size !== equipped.length) return false;
      next[side] = [...values];
    }
    state.loadout = next;
    state.active = content.active === &#x27;yin&#x27; ? &#x27;yin&#x27; : &#x27;yang&#x27;;
    state.preset = &#x27;custom&#x27;;
    for (const [id, loadout] of Object.entries(presets)) {
      if (JSON.stringify(next) === JSON.stringify(loadout)) state.preset = id;
    }
    state.selectedIndex = ui &amp;&amp; Number.isInteger(ui.selectedIndex) &amp;&amp; ui.selectedIndex &gt;= 0 &amp;&amp; ui.selectedIndex &lt; 6 ? ui.selectedIndex : 0;
    state.drafts = {};
    for (const [key,value] of Object.entries(ui &amp;&amp; ui.drafts || {})) {
      if (/^(yang|yin):[0-5]$/.test(key) &amp;&amp; (value === null || runes.has(value))) state.drafts[key] = value;
    }
    return true;
  }
  function persist() {
    const api = window.openai;
    if (!api || typeof api.setWidgetState !== &#x27;function&#x27;) return;
    api.setWidgetState({
      modelContent: { version: 1, system: &#x27;六道轮回六边形双面装备设计预览&#x27;, roleOrder: roles.map(role =&gt; role.name), loadout: cloneLoadout(state.loadout), active: state.active },
      privateContent: { selectedIndex: state.selectedIndex, drafts: {...state.drafts} }
    }).catch(() =&gt; {});
  }
  function effectFor(side, index, runeId = state.loadout[side][index]) {
    const role = roles[index].id;
    if (runes.has(runeId)) return runes.get(runeId)[side][role];
    const [name, description] = defaults[role][side];
    return { name, description, tags: [] };
  }
  function announce(message) { element(&#x27;rune-announcement&#x27;).textContent = message; }
  function updateInteractivity() {
    for (const side of [&#x27;yang&#x27;,&#x27;yin&#x27;]) {
      faces[side].inert = flipping || side !== state.active;
      faces[side].setAttribute(&#x27;aria-hidden&#x27;, String(side !== state.active));
      buttons[side].forEach(button =&gt; { button.disabled = flipping || side !== state.active; });
    }
    element(&#x27;rune-flip&#x27;).disabled = flipping;
    element(&#x27;rune-preset&#x27;).disabled = flipping;
    element(&#x27;rune-picker&#x27;).disabled = flipping;
    element(&#x27;rune-equip&#x27;).disabled = flipping || candidateId() === currentId();
    element(&#x27;rune-cancel&#x27;).disabled = flipping;
    element(&#x27;rune-stage&#x27;).setAttribute(&#x27;aria-busy&#x27;, String(flipping));
  }
  function finishFlip() {
    if (!flipping) return;
    flipping = false;
    clearTimeout(flipTimer);
    updateInteractivity();
  }
  roles.forEach((role, index) =&gt; {
    for (const side of [&#x27;yang&#x27;,&#x27;yin&#x27;]) {
      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
      button.className = &#x27;rune-slot cursor-interaction&#x27;;
      button.dataset.side = side;
      button.dataset.index = String(index);
      const title = document.createElement(&#x27;span&#x27;);
      title.className = &#x27;rune-slot-role&#x27;;
      title.textContent = role.name;
      const name = document.createElement(&#x27;span&#x27;);
      name.className = &#x27;rune-slot-name&#x27;;
      const label = document.createElement(&#x27;small&#x27;);
      label.textContent = role.label;
      button.append(title, name, label);
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (flipping || side !== state.active) return;
        state.selectedIndex = index;
        announce(`已选${sideNames[side]}面${role.name}。`);
        render();
        persist();
      });
      buttons[side].push(button);
      faces[side].append(button);
    }
  });
  function render() {
    const { selectedIndex, active } = state;
    const otherSide = active === &#x27;yang&#x27; ? &#x27;yin&#x27; : &#x27;yang&#x27;;
    const equipped = currentId();
    const candidate = candidateId();
    const dirty = candidate !== equipped;
    const effect = effectFor(active, selectedIndex);
    const after = effectFor(active, selectedIndex, candidate);
    const alternate = effectFor(otherSide, selectedIndex, candidate);
    root.dataset.side = active;
    dial.classList.toggle(&#x27;is-yin&#x27;, active === &#x27;yin&#x27;);
    element(&#x27;rune-preset&#x27;).value = state.preset;
    element(&#x27;rune-flip-label&#x27;).textContent = `翻至${sideNames[otherSide]}面`;
    element(&#x27;rune-flip&#x27;).setAttribute(&#x27;aria-label&#x27;, `翻至${sideNames[otherSide]}面`);
    element(&#x27;rune-active-label&#x27;).textContent = `正在编辑 · ${sideNames[active]}面`;
    element(&#x27;rune-current-weapon&#x27;).textContent = `武器：${effectFor(active, 0).name}`;
    element(&#x27;rune-face-count&#x27;).textContent = `${sideNames[active]}面 ${state.loadout[active].filter(Boolean).length} / 6`;
    for (const side of [&#x27;yang&#x27;,&#x27;yin&#x27;]) {
      buttons[side].forEach((button, index) =&gt; {
        const rune = runes.get(state.loadout[side][index]);
        button.querySelector(&#x27;.rune-slot-name&#x27;).textContent = rune ? rune.name : &#x27;空槽&#x27;;
        button.setAttribute(&#x27;aria-pressed&#x27;, String(side === active &amp;&amp; index === selectedIndex));
        button.setAttribute(&#x27;aria-label&#x27;, `${sideNames[side]} · ${roles[index].name} · ${rune ? rune.name : &#x27;未装备&#x27;} · ${effectFor(side, index).name}`);
      });
    }
    element(&#x27;rune-slot-title&#x27;).textContent = `${sideNames[active]} · ${roles[selectedIndex].name}`;
    element(&#x27;rune-slot-function&#x27;).textContent = roles[selectedIndex].label;
    const picker = element(&#x27;rune-picker&#x27;);
    picker.replaceChildren();
    const empty = document.createElement(&#x27;option&#x27;);
    empty.value = &#x27;&#x27;;
    empty.textContent = &#x27;卸下符文 · 使用基础能力&#x27;;
    picker.append(empty);
    for (const rune of catalog.runes) {
      const option = document.createElement(&#x27;option&#x27;);
      option.value = rune.id;
      const occupiedAt = state.loadout[active].indexOf(rune.id);
      option.textContent = rune.name + (occupiedAt &gt;= 0 &amp;&amp; occupiedAt !== selectedIndex ? ` · 从${roles[occupiedAt].name}移入` : &#x27;&#x27;);
      picker.append(option);
    }
    picker.value = candidate || &#x27;&#x27;;
    element(&#x27;rune-effect-grid&#x27;).dataset.comparing = String(dirty);
    element(&#x27;rune-effect-label&#x27;).textContent = dirty ? &#x27;当前装备&#x27; : &#x27;当前槽位效果&#x27;;
    element(&#x27;rune-effect-name&#x27;).textContent = effect.name;
    element(&#x27;rune-effect-description&#x27;).textContent = effect.description;
    element(&#x27;rune-candidate&#x27;).hidden = !dirty;

    }

})();
