<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Jump</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@4.2.0/dist/phaser.min.js"></script>
  <script defer src="src/data/level-01.js"></script>
  <script defer src="src/game-scene.js"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <a class="back-link" href="../index.html" target="_blank" rel="noopener">&larr; BACK</a>

  <main class="shell">
    <header class="topbar" aria-live="polite">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Shadow Jump</span>
      </div>

      <div class="hud">
        <div class="meters" aria-label="角色资源">
          <div class="meter hp-meter">
            <span>HP</span>
            <b id="hp-value">100</b>
            <i><em id="hp-bar"></em></i>
          </div>
          <div class="meter mp-meter">
            <span>MP</span>
            <b id="mp-value">100</b>
            <i><em id="mp-bar"></em></i>
          </div>
        </div>

        <div class="hud-chip" id="crystals">晶石 0/5</div>
        <div class="hud-chip" id="level">Lv 1 · 0/60</div>
        <div class="hud-chip gear" id="equipment">羽刃 / 影靴 / 魂匣</div>
        <div class="hud-chip spirit" id="spirit-core">灵格：圣盾</div>

        <div class="mode-box" aria-label="场景">
          <button class="mode-token light active" id="light-scene" type="button" aria-label="光场景"></button>
          <button class="mode-token shadow" id="shadow-scene" type="button" aria-label="影场景"></button>
        </div>

        <div class="mode-box" aria-label="形态">
          <button class="mode-token light active" id="light-form" type="button" aria-label="光形态"></button>
          <button class="mode-token shadow" id="shadow-form" type="button" aria-label="影形态"></button>
        </div>

        <div class="hud-chip state" id="state">准备</div>
      </div>
    </header>

    <section class="game-frame" aria-label="Shadow Jump playable game">
      <div id="game-root"></div>

      <div class="overlay" id="overlay">
        <div class="panel">
          <h1>Shadow Jump</h1>
          <p>光与影是两个独立系统。击败敌人、破门和收集晶石可获得经验；装备提供被动加成；U 键释放当前形态的灵格技能。</p>
          <div class="controls">
            <span>A/D 移动</span>
            <span>K 跳跃</span>
            <span>J 攻击</span>
            <span>U 技能</span>
            <span>空格 切场景</span>
            <span>L 切形态</span>
            <span>Shift 冲刺</span>
            <span>R 重开</span>
          </div>
          <button class="primary" id="start" type="button">开始游戏</button>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <span>目标：通过教学段、组合路线和小 Boss，收集 5 枚晶石后开启双界传送门。</span>
      <span class="hint">P 暂停 · 同属性回蓝 · 反向组合耗蓝 · U 灵格</span>
    </footer>

    <nav class="touch-controls" aria-label="触控操作">
      <button data-hold="left" type="button">←</button>
      <button data-hold="right" type="button">→</button>
      <button data-action="jump" type="button">K</button>
      <button data-action="attack" type="button">J</button>
      <button data-action="skill" type="button">U</button>
      <button data-action="scene" type="button">⌓</button>
      <button data-action="form" type="button">◐</button>
      <button data-action="dash" type="button">⇥</button>
    </nav>
  </main>
</body>
</html>
