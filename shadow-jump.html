<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Jump</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101416;
      color: #eef4ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(77, 180, 169, 0.18), transparent 28rem),
        radial-gradient(circle at 82% 12%, rgba(222, 170, 74, 0.15), transparent 24rem),
        linear-gradient(160deg, #101416 0%, #151a1c 55%, #0d1012 100%);
      overflow: hidden;
    }

    .shell {
      width: min(100vw, 1180px);
      height: min(100vh, 720px);
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 34px;
      color: #dce7de;
      font-size: 14px;
      letter-spacing: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      color: #fff7d8;
    }

    .mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background:
        linear-gradient(135deg, transparent 0 45%, #0e1114 46% 54%, transparent 55%),
        linear-gradient(135deg, #f3c95b, #4db4a9);
      box-shadow: 0 0 18px rgba(243, 201, 91, 0.35);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .pill {
      min-width: 88px;
      padding: 6px 10px;
      border: 1px solid rgba(238, 244, 238, 0.16);
      border-radius: 6px;
      background: rgba(8, 11, 13, 0.42);
      text-align: center;
      white-space: nowrap;
    }

    .mode-marks {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border: 1px solid rgba(238, 244, 238, 0.16);
      border-radius: 6px;
      background: rgba(8, 11, 13, 0.42);
    }

    .mode-token {
      position: relative;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .mode-token::before,
    .mode-token::after,
    .token-core {
      content: "";
      position: absolute;
      inset: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .token-core {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .mode-token.light::before {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 232, 148, 0.45);
    }

    .mode-token.light::after {
      width: 6px;
      height: 22px;
      background: #ffe894;
      box-shadow: 0 0 16px rgba(255, 232, 148, 0.55);
    }

    .mode-token.light .token-core {
      background: #fff7d8;
      box-shadow: 0 0 14px rgba(255, 247, 216, 0.9);
    }

    .mode-token.shadow::before {
      width: 21px;
      height: 21px;
      border: 2px solid #bd2f2f;
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 5px 50% 5px 50%;
      box-shadow: 0 0 14px rgba(189, 47, 47, 0.52);
    }

    .mode-token.shadow::after {
      width: 5px;
      height: 22px;
      background: #ff7048;
      transform: translate(-50%, -50%) rotate(-35deg);
    }

    .mode-token.shadow .token-core {
      width: 9px;
      height: 9px;
      background: #16080a;
      border: 2px solid #ff7048;
    }

    .mode-token.active {
      outline: 2px solid #fff7d8;
      outline-offset: 2px;
    }

    .game-frame {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(238, 244, 238, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #182022;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(10, 13, 15, 0.64);
      backdrop-filter: blur(4px);
    }

    .panel {
      width: min(520px, 100%);
      padding: 22px;
      border: 1px solid rgba(238, 244, 238, 0.18);
      border-radius: 8px;
      background: rgba(18, 23, 25, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .panel h1 {
      margin: 0 0 8px;
      color: #fff2bd;
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1;
      letter-spacing: 0;
    }

    .panel p {
      margin: 8px 0;
      color: #d8e2dc;
      line-height: 1.55;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 16px 0;
      font-size: 13px;
      color: #ecf5ed;
    }

    .key {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: #f3c95b;
      color: #151613;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #ffd96c;
    }

    .hidden {
      display: none;
    }

    .hint {
      color: #aebbb2;
      font-size: 13px;
      text-align: right;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .shell {
        height: 100vh;
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }

      .pill {
        min-width: 72px;
        font-size: 12px;
      }

      .mode-marks {
        padding: 4px 7px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .hint {
        text-align: left;
      }
    }
  </style>
</head>
<body>
<a href="index.html" target="_blank" rel="noopener" style="position:fixed;top:16px;left:16px;z-index:10000;padding:6px 16px;background:rgba(16,20,22,0.9);border:1px solid #2a2e30;color:#6a7a6e;font-size:11px;letter-spacing:2px;text-decoration:none;font-family:monospace;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));transition:all 0.2s;" onmouseover="this.style.borderColor='#f3c95b';this.style.color='#f3c95b'" onmouseout="this.style.borderColor='#2a2e30';this.style.color='#6a7a6e'">&larr; BACK</a>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span> Shadow Jump</div>
      <div class="stats" aria-live="polite">
        <div class="pill" id="hp">生命 3</div>
        <div class="pill" id="crystals">晶石 0/5</div>
        <div class="mode-marks" aria-label="场景标记">
          <button class="mode-token light active" id="lightSceneMark" type="button" aria-label="切换到光场景">
            <span class="token-core" aria-hidden="true"></span>
          </button>
          <button class="mode-token shadow" id="shadowSceneMark" type="button" aria-label="切换到影场景">
            <span class="token-core" aria-hidden="true"></span>
          </button>
        </div>
        <div class="mode-marks" aria-label="形态标记">
          <button class="mode-token light active" id="lightFormMark" type="button" aria-label="切换到光形态">
            <span class="token-core" aria-hidden="true"></span>
          </button>
          <button class="mode-token shadow" id="shadowFormMark" type="button" aria-label="切换到影形态">
            <span class="token-core" aria-hidden="true"></span>
          </button>
        </div>
        <div class="pill" id="state">准备</div>
      </div>
    </header>

    <section class="game-frame" aria-label="Shadow Jump playable prototype">
      <canvas id="game" width="1152" height="648"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h1>Shadow Jump</h1>
          <p>一个天堂与深渊双环境横版动作原型。你需要在两种环境之间快速切换，利用不同地形穿过遗迹，收集月辉晶石，并抵达传送门。</p>
          <div class="controls">
            <div class="key">A / D 或 方向键：移动</div>
            <div class="key">K：跳跃，光形态更高更轻</div>
            <div class="key">J：光形态远程，影形态近战</div>
            <div class="key">空格：切换光 / 影场景</div>
            <div class="key">L：切换光 / 影形态并触发技能</div>
            <div class="key">Shift：冲刺，影形态更快更远</div>
          </div>
          <button id="start">开始游戏</button>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <span>目标：在天堂与深渊环境之间切换，收集 5 枚晶石，到达右侧传送门。</span>
      <span class="hint">J 攻击 · K 跳跃 · 空格切场景 · L 切形态 · R 重开 · P 暂停</span>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hpEl = document.getElementById("hp");
    const crystalsEl = document.getElementById("crystals");
    const lightSceneMark = document.getElementById("lightSceneMark");
    const shadowSceneMark = document.getElementById("shadowSceneMark");
    const lightFormMark = document.getElementById("lightFormMark");
    const shadowFormMark = document.getElementById("shadowFormMark");
    const stateEl = document.getElementById("state");
    const overlay = document.getElementById("overlay");
    const startButton = document.getElementById("start");

    const W = canvas.width;
    const H = canvas.height;
    const FLOOR = H - 82;
    const GRAVITY = 0.82;
    const keys = new Set();

    let running = false;
    let paused = false;
    let won = false;
    let lost = false;
    let cameraX = 0;
    let lastTime = performance.now();
    let slashTimer = 0;
    let dashCooldown = 0;
    let shake = 0;
    let messageTimer = 0;
    let message = "";
    let sceneMode = "light";
    let formMode = "light";
    let switchTimer = 0;
    let formSwitchTimer = 0;
    let projectiles = [];

    const worldWidth = 3450;

    const platforms = [
      { x: 0, y: FLOOR, w: 520, h: 92, type: "ground", mode: "both" },
      { x: 560, y: FLOOR - 52, w: 180, h: 24, type: "stone", mode: "light" },
      { x: 825, y: FLOOR - 122, w: 190, h: 24, type: "stone", mode: "shadow" },
      { x: 1100, y: FLOOR, w: 360, h: 92, type: "ground", mode: "both" },
      { x: 1540, y: FLOOR - 72, w: 190, h: 24, type: "stone", mode: "light" },
      { x: 1835, y: FLOOR - 142, w: 190, h: 24, type: "stone", mode: "shadow" },
      { x: 2130, y: FLOOR - 48, w: 230, h: 24, type: "stone", mode: "light" },
      { x: 2470, y: FLOOR, w: 410, h: 92, type: "ground", mode: "both" },
      { x: 2920, y: FLOOR - 96, w: 210, h: 24, type: "stone", mode: "shadow" },
      { x: 3180, y: FLOOR, w: 270, h: 92, type: "ground", mode: "both" },
      { x: 645, y: FLOOR - 174, w: 112, h: 20, type: "glass", mode: "shadow" },
      { x: 1325, y: FLOOR - 118, w: 130, h: 20, type: "glass", mode: "shadow" },
      { x: 2260, y: FLOOR - 128, w: 130, h: 20, type: "glass", mode: "shadow" },
      { x: 2650, y: FLOOR - 118, w: 170, h: 20, type: "glass", mode: "light" }
    ];

    const hazards = [
      { x: 760, y: FLOOR + 46, w: 260, h: 38, mode: "light" },
      { x: 1468, y: FLOOR + 46, w: 250, h: 38, mode: "shadow" },
      { x: 2370, y: FLOOR + 46, w: 120, h: 38, mode: "light" },
      { x: 2878, y: FLOOR + 46, w: 190, h: 38, mode: "shadow" }
    ];

    const crystals = [
      { x: 625, y: FLOOR - 94, taken: false, mode: "light" },
      { x: 905, y: FLOOR - 165, taken: false, mode: "shadow" },
      { x: 1620, y: FLOOR - 114, taken: false, mode: "light" },
      { x: 1910, y: FLOOR - 184, taken: false, mode: "shadow" },
      { x: 3005, y: FLOOR - 138, taken: false, mode: "shadow" }
    ];

    const enemies = [
      { x: 390, y: FLOOR - 32, w: 42, h: 32, hp: 2, min: 300, max: 500, vx: 0.9, hit: 0, mode: "light" },
      { x: 1240, y: FLOOR - 36, w: 48, h: 36, hp: 3, min: 1120, max: 1410, vx: 1.2, hit: 0, mode: "shadow" },
      { x: 2210, y: FLOOR - 84, w: 44, h: 36, hp: 2, min: 2140, max: 2330, vx: 1.0, hit: 0, mode: "light" },
      { x: 2665, y: FLOOR - 42, w: 56, h: 42, hp: 4, min: 2495, max: 2840, vx: 1.35, hit: 0, mode: "shadow" }
    ];

    const portal = { x: 3330, y: FLOOR - 112, w: 76, h: 112 };

    const playerStart = { x: 74, y: FLOOR - 58 };
    const player = {
      x: playerStart.x,
      y: playerStart.y,
      w: 34,
      h: 58,
      vx: 0,
      vy: 0,
      hp: 3,
      facing: 1,
      grounded: false,
      jumps: 0,
      invuln: 0,
      dash: 0,
      attack: 0,
      checkpoint: { ...playerStart }
    };

    function activeInCurrentMode(entity) {
      return !entity.mode || entity.mode === "both" || entity.mode === sceneMode;
    }

    function sceneName() {
      return sceneMode === "light" ? "光场景" : "影场景";
    }

    function formName() {
      return formMode === "light" ? "光形态" : "影形态";
    }

    function switchScene(nextMode) {
      if (!running || paused || won || lost) return;
      const targetMode = nextMode || (sceneMode === "light" ? "shadow" : "light");
      if (targetMode === sceneMode) return;
      const keepX = player.x;
      const keepY = player.y;
      sceneMode = targetMode;
      player.x = keepX;
      player.y = keepY;
      switchTimer = 18;
      shake = Math.max(shake, 5);
      projectiles = projectiles.filter(projectile => projectile.mode === targetMode);
      updateHud();
    }

    function switchForm(nextMode) {
      if (!running || paused || won || lost) return;
      const targetMode = nextMode || (formMode === "light" ? "shadow" : "light");
      if (targetMode === formMode) return;
      const previousMode = formMode;
      const keepX = player.x;
      const keepY = player.y;
      formMode = targetMode;
      player.x = keepX;
      player.y = keepY;
      player.attack = 0;
      slashTimer = 0;
      formSwitchTimer = 18;
      applyFormSwitchSkill(previousMode, targetMode);
      updateHud();
    }

    function applyFormSwitchSkill(previousMode, targetMode) {
      const burst = {
        x: player.x + player.w / 2 - 86,
        y: player.y + player.h / 2 - 64,
        w: 172,
        h: 128
      };
      let touched = false;

      for (const enemy of enemies) {
        if (enemy.hp <= 0 || !activeInCurrentMode(enemy) || !rectsOverlap(burst, enemy)) continue;
        const direction = enemy.x + enemy.w / 2 < player.x + player.w / 2 ? -1 : 1;
        if (previousMode === "light" && targetMode === "shadow") {
          damageEnemy(enemy, 1, direction * 1.7);
          touched = true;
        } else {
          enemy.vx += direction * 2.2;
          enemy.hit = 16;
          touched = true;
        }
      }

      if (previousMode === "shadow" && targetMode === "light") {
        player.vy = Math.min(player.vy, -3.5);
      }

      if (touched) {
        shake = Math.max(shake, previousMode === "light" ? 12 : 8);
      }
    }

    function resetGame() {
      running = true;
      paused = false;
      won = false;
      lost = false;
      sceneMode = "light";
      formMode = "light";
      cameraX = 0;
      slashTimer = 0;
      dashCooldown = 0;
      shake = 0;
      switchTimer = 0;
      formSwitchTimer = 0;
      projectiles = [];
      messageTimer = 160;
      message = "空格切场景，L 切形态，角色位置不变";
      Object.assign(player, {
        x: playerStart.x,
        y: playerStart.y,
        w: 34,
        h: 58,
        vx: 0,
        vy: 0,
        hp: 3,
        facing: 1,
        grounded: false,
        jumps: 0,
        invuln: 0,
        dash: 0,
        attack: 0,
        checkpoint: { ...playerStart }
      });
      crystals.forEach(c => c.taken = false);
      enemies[0] = { x: 390, y: FLOOR - 32, w: 42, h: 32, hp: 2, min: 300, max: 500, vx: 0.9, hit: 0, mode: "light" };
      enemies[1] = { x: 1240, y: FLOOR - 36, w: 48, h: 36, hp: 3, min: 1120, max: 1410, vx: 1.2, hit: 0, mode: "shadow" };
      enemies[2] = { x: 2210, y: FLOOR - 84, w: 44, h: 36, hp: 2, min: 2140, max: 2330, vx: 1.0, hit: 0, mode: "light" };
      enemies[3] = { x: 2665, y: FLOOR - 42, w: 56, h: 42, hp: 4, min: 2495, max: 2840, vx: 1.35, hit: 0, mode: "shadow" };
      overlay.classList.add("hidden");
      updateHud();
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function jump() {
      if (!running || paused || won || lost) return;
      if (player.grounded || player.jumps < 2) {
        const isLight = formMode === "light";
        player.vy = player.grounded
          ? (isLight ? -16.9 : -14.8)
          : (isLight ? -14.2 : -12.6);
        player.grounded = false;
        player.jumps += 1;
      }
    }

    function attack() {
      if (!running || paused || won || lost || player.attack > 0) return;
      player.attack = formMode === "light" ? 20 : 18;

      if (formMode === "light") {
        const inLightScene = sceneMode === "light";
        projectiles.push({
          x: player.x + player.w / 2 + player.facing * 22,
          y: player.y + 21,
          vx: player.facing * (inLightScene ? 13.4 : 12.1),
          w: inLightScene ? 42 : 36,
          h: 12,
          life: inLightScene ? 68 : 58,
          damage: 1,
          mode: sceneMode,
          scene: sceneMode
        });
        message = "圣羽射出";
        messageTimer = 32;
        return;
      }

      slashTimer = 18;
      const arc = {
        x: player.facing > 0 ? player.x + player.w - 8 : player.x - 74,
        y: player.y - 2,
        w: 82,
        h: 54
      };
      for (const enemy of enemies) {
        if (enemy.hp > 0 && activeInCurrentMode(enemy) && rectsOverlap(arc, enemy)) {
          damageEnemy(enemy, 2, player.facing * 1.25);
          message = enemy.hp <= 0 ? "炼狱斩击击倒了守卫" : "命中";
          messageTimer = 42;
        }
      }
    }

    function damageEnemy(enemy, amount, knockback = 0) {
      enemy.hp -= amount;
      enemy.hit = 16;
      enemy.vx += knockback;
      shake = Math.max(shake, 8);
    }

    function dash() {
      if (!running || paused || won || lost || dashCooldown > 0) return;
      const isShadow = formMode === "shadow";
      player.dash = isShadow ? 15 : 9;
      dashCooldown = isShadow ? 64 : 78;
      player.vx = player.facing * (isShadow ? 17 : 11.5);
      player.vy *= isShadow ? 0.24 : 0.45;
    }

    function hurt(amount = 1) {
      if (player.invuln > 0 || won || lost) return;
      player.hp -= amount;
      player.invuln = 86;
      shake = 14;
      player.vx = -player.facing * 7;
      player.vy = -8;
      if (player.hp <= 0) {
        lost = true;
        running = false;
        stateEl.textContent = "失败";
        showEnd("影子消散", "你倒在森林遗迹中。按 R 或点击按钮重新挑战。", "重新开始");
      } else {
        message = "受伤，回到安全节奏";
        messageTimer = 70;
      }
      updateHud();
    }

    function showEnd(title, body, buttonText) {
      overlay.innerHTML = `
        <div class="panel">
          <h1>${title}</h1>
          <p>${body}</p>
          <p>已收集 ${crystals.filter(c => c.taken).length}/5 枚月辉晶石。</p>
          <button id="restart">${buttonText}</button>
        </div>`;
      overlay.classList.remove("hidden");
      document.getElementById("restart").addEventListener("click", resetGame);
    }

    function updateHud() {
      hpEl.textContent = `生命 ${Math.max(0, player.hp)}`;
      crystalsEl.textContent = `晶石 ${crystals.filter(c => c.taken).length}/5`;
      lightSceneMark.classList.toggle("active", sceneMode === "light");
      shadowSceneMark.classList.toggle("active", sceneMode === "shadow");
      lightFormMark.classList.toggle("active", formMode === "light");
      shadowFormMark.classList.toggle("active", formMode === "shadow");
      stateEl.textContent = won ? "通关" : lost ? "失败" : paused ? "暂停" : running ? "冒险中" : "准备";
    }

    function updatePlayer() {
      const left = keys.has("arrowleft") || keys.has("a");
      const right = keys.has("arrowright") || keys.has("d");
      const isLight = formMode === "light";
      const accel = player.grounded
        ? (isLight ? 0.86 : 1.08)
        : (isLight ? 0.72 : 0.56);
      const friction = player.grounded ? (isLight ? 0.8 : 0.76) : (isLight ? 0.93 : 0.95);
      const maxSpeed = player.dash > 0
        ? (isLight ? 13.5 : 18)
        : (isLight ? 5.8 : 7.25);
      const gravity = player.dash > 0
        ? GRAVITY * (isLight ? 0.16 : 0.2)
        : GRAVITY * (isLight ? 0.72 : 1.12);
      const maxFall = isLight ? 14.5 : 20;

      if (left) {
        player.vx -= accel;
        player.facing = -1;
      }
      if (right) {
        player.vx += accel;
        player.facing = 1;
      }
      if (!left && !right && player.dash <= 0) player.vx *= friction;

      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
      player.vy += gravity;
      if (player.vy > maxFall) player.vy = maxFall;

      const prevY = player.y;
      player.x += player.vx;
      player.x = Math.max(0, Math.min(worldWidth - player.w, player.x));
      player.y += player.vy;
      player.grounded = false;

      for (const platform of platforms) {
        if (!activeInCurrentMode(platform)) continue;
        if (!rectsOverlap(player, platform)) continue;
        const wasAbove = prevY + player.h <= platform.y + 5;
        if (wasAbove && player.vy >= 0) {
          player.y = platform.y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumps = 0;
        } else if (player.x + player.w * 0.5 < platform.x + platform.w * 0.5) {
          player.x = platform.x - player.w;
          player.vx = Math.min(0, player.vx);
        } else {
          player.x = platform.x + platform.w;
          player.vx = Math.max(0, player.vx);
        }
      }

      for (const hazard of hazards) {
        if (!activeInCurrentMode(hazard)) continue;
        if (rectsOverlap(player, hazard)) hurt(1);
      }

      if (player.y > H + 140) {
        hurt(1);
        if (!lost) {
          player.x = player.checkpoint.x;
          player.y = player.checkpoint.y;
          player.vx = 0;
          player.vy = 0;
        }
      }

      if (player.x > 2380 && player.checkpoint.x < 2460) {
        player.checkpoint = { x: 2520, y: FLOOR - 58 };
        message = "已激活遗迹中段的暗影印记";
        messageTimer = 96;
      }

      for (const crystal of crystals) {
        if (!activeInCurrentMode(crystal)) continue;
        if (!crystal.taken && rectsOverlap(player, { x: crystal.x - 16, y: crystal.y - 16, w: 32, h: 32 })) {
          crystal.taken = true;
          message = "获得月辉晶石";
          messageTimer = 62;
          updateHud();
        }
      }

      if (rectsOverlap(player, portal)) {
        const count = crystals.filter(c => c.taken).length;
        if (count >= 5) {
          won = true;
          running = false;
          updateHud();
          showEnd("传送门开启", "你完成了 Shadow Jump 的第一段旅程。这个原型已经包含移动、二段跳、冲刺、攻击、敌人、陷阱、收集与通关目标。", "再玩一次");
        } else {
          message = `还需要 ${5 - count} 枚晶石`;
          messageTimer = 66;
        }
      }

      if (player.invuln > 0) player.invuln -= 1;
      if (player.dash > 0) player.dash -= 1;
      if (player.attack > 0) player.attack -= 1;
      if (slashTimer > 0) slashTimer -= 1;
      if (formSwitchTimer > 0) formSwitchTimer -= 1;
      if (dashCooldown > 0) dashCooldown -= 1;
    }

    function updateEnemies() {
      for (const enemy of enemies) {
        if (enemy.hp <= 0 || !activeInCurrentMode(enemy)) continue;
        enemy.x += enemy.vx;
        if (enemy.x < enemy.min || enemy.x + enemy.w > enemy.max) {
          enemy.vx *= -1;
          enemy.x = Math.max(enemy.min, Math.min(enemy.max - enemy.w, enemy.x));
        }
        if (enemy.hit > 0) enemy.hit -= 1;
        if (rectsOverlap(player, enemy)) {
          player.facing = player.x < enemy.x ? 1 : -1;
          hurt(1);
        }
      }
    }

    function updateProjectiles() {
      for (const projectile of projectiles) {
        projectile.x += projectile.vx;
        projectile.life -= 1;
        for (const enemy of enemies) {
          if (enemy.hp <= 0 || !activeInCurrentMode(enemy)) continue;
          if (rectsOverlap(projectile, enemy)) {
            damageEnemy(enemy, projectile.damage || 1, Math.sign(projectile.vx) * 0.45);
            projectile.life = 0;
            message = enemy.hp <= 0 ? "圣羽净化了守卫" : "命中";
            messageTimer = 34;
            break;
          }
        }
      }
      projectiles = projectiles.filter(projectile =>
        projectile.life > 0 &&
        projectile.x > cameraX - 120 &&
        projectile.x < cameraX + W + 120 &&
        projectile.mode === sceneMode
      );
    }

    function updateCamera() {
      const target = player.x + player.w / 2 - W * 0.42;
      cameraX += (target - cameraX) * 0.08;
      cameraX = Math.max(0, Math.min(worldWidth - W, cameraX));
      if (shake > 0) shake -= 1;
      if (messageTimer > 0) messageTimer -= 1;
    }

    function drawBackground(t) {
      const isLight = sceneMode === "light";
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, isLight ? "#dbeeff" : "#08070c");
      sky.addColorStop(0.48, isLight ? "#f6eec8" : "#211018");
      sky.addColorStop(1, isLight ? "#b9d8ee" : "#3a0d0d");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(-cameraX * 0.18, 0);
      if (isLight) {
        ctx.fillStyle = "rgba(255, 247, 216, 0.9)";
        ctx.beginPath();
        ctx.arc(178, 118, 52, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 232, 148, 0.5)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(178, 118, 72 + Math.sin(t * 0.002) * 4, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = -1; i < 16; i++) {
          const x = i * 310 + 40;
          const y = 112 + Math.sin(i + t * 0.0004) * 10;
          drawCloud(x, y, 1.05);
        }
      } else {
        for (let i = 0; i < 22; i++) {
          const x = i * 190 + 20;
          const y = 70 + Math.sin(i * 1.6 + t * 0.001) * 20;
          ctx.fillStyle = i % 2 === 0 ? "rgba(255, 74, 36, 0.7)" : "rgba(129, 28, 39, 0.8)";
          ctx.beginPath();
          ctx.arc(x, y, i % 2 === 0 ? 2.8 : 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      ctx.save();
      ctx.translate(-cameraX * 0.35, 0);
      for (let i = -1; i < 12; i++) {
        const x = i * 350;
        ctx.fillStyle = isLight ? "rgba(214, 226, 232, 0.72)" : "#13080d";
        ctx.beginPath();
        ctx.moveTo(x, H);
        ctx.lineTo(x + 90, isLight ? 302 : 252);
        ctx.lineTo(x + 170, isLight ? 278 : 324);
        ctx.lineTo(x + 260, isLight ? 296 : 216);
        ctx.lineTo(x + 370, H);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(-cameraX * 0.58, 0);
      if (isLight) {
        for (let i = -1; i < 16; i++) {
          const x = i * 260 + 30;
          ctx.fillStyle = "rgba(255, 250, 228, 0.84)";
          ctx.fillRect(x + 82, 278, 24, 270);
          ctx.fillRect(x + 62, 270, 64, 14);
          ctx.fillStyle = "rgba(231, 196, 104, 0.72)";
          ctx.fillRect(x + 78, 292, 32, 5);
        }
      } else {
        for (let i = -1; i < 16; i++) {
          const x = i * 260 + 30;
          ctx.fillStyle = "#1a0b10";
          ctx.beginPath();
          ctx.moveTo(x + 68, H);
          ctx.lineTo(x + 100, 270);
          ctx.lineTo(x + 132, H);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(255, 74, 36, 0.55)";
          ctx.fillRect(x + 95, 314, 8, 234);
        }
      }
      ctx.restore();
    }

    function drawCloud(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
      ctx.beginPath();
      ctx.arc(0, 6, 28, 0, Math.PI * 2);
      ctx.arc(28, -2, 34, 0, Math.PI * 2);
      ctx.arc(66, 8, 28, 0, Math.PI * 2);
      ctx.fillRect(-8, 4, 86, 28);
      ctx.fill();
      ctx.restore();
    }

    function drawWorld(t) {
      ctx.save();
      const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
      const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
      ctx.translate(-cameraX + sx, sy);

      for (const platform of platforms) {
        const active = activeInCurrentMode(platform);
        if (!active) {
          ctx.globalAlpha = 0.16;
          ctx.strokeStyle = platform.mode === "light" ? "#f3c95b" : "#9b6be5";
          ctx.lineWidth = 2;
          ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
          ctx.globalAlpha = 1;
          continue;
        }
        const isShadow = platform.mode === "shadow";
        const isLightOnly = platform.mode === "light";
        ctx.fillStyle = platform.type === "ground"
          ? (sceneMode === "light" ? "#d5c184" : "#2a1216")
          : isShadow ? "#3b1820" : isLightOnly ? "#e8d79b" : "#59605b";
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.fillStyle = platform.type === "ground"
          ? (sceneMode === "light" ? "#fff1b0" : "#ff7048")
          : isShadow ? "#ff7048" : isLightOnly ? "#fff7d8" : "#9fa9a1";
        ctx.fillRect(platform.x, platform.y, platform.w, 8);
        ctx.fillStyle = sceneMode === "light" ? "rgba(111, 92, 41, 0.22)" : "rgba(255, 74, 36, 0.2)";
        for (let x = platform.x + 18; x < platform.x + platform.w; x += 54) {
          ctx.fillRect(x, platform.y + 16, 28, 5);
        }
      }

      for (const hazard of hazards) {
        if (!activeInCurrentMode(hazard)) continue;
        ctx.fillStyle = hazard.mode === "shadow" ? "#18070a" : "#7d6a38";
        ctx.fillRect(hazard.x, hazard.y + hazard.h - 6, hazard.w, 8);
        for (let x = hazard.x; x < hazard.x + hazard.w; x += 24) {
          ctx.fillStyle = hazard.mode === "shadow" ? "#bd2f2f" : "#ffe894";
          ctx.beginPath();
          ctx.moveTo(x, hazard.y + hazard.h);
          ctx.lineTo(x + 12, hazard.y);
          ctx.lineTo(x + 24, hazard.y + hazard.h);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = hazard.mode === "shadow" ? "#ff7048" : "#ffffff";
          ctx.fillRect(x + 10, hazard.y + 10, 4, 12);
        }
      }

      for (const crystal of crystals) {
        if (!activeInCurrentMode(crystal)) continue;
        if (crystal.taken) continue;
        const bob = Math.sin(t * 0.004 + crystal.x) * 5;
        ctx.save();
        ctx.translate(crystal.x, crystal.y + bob);
        ctx.fillStyle = crystal.mode === "shadow" ? "rgba(255, 74, 36, 0.18)" : "rgba(255, 247, 216, 0.28)";
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = crystal.mode === "shadow" ? "#ff7048" : "#fff7d8";
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(13, 0);
        ctx.lineTo(0, 20);
        ctx.lineTo(-13, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff7d8";
        ctx.fillRect(-3, -12, 6, 8);
        ctx.restore();
      }

      for (const enemy of enemies) {
        if (enemy.hp <= 0 || !activeInCurrentMode(enemy)) continue;
        const glow = enemy.hit > 0 ? "#ffd96c" : enemy.mode === "light" ? "#b48b3c" : "#bd2f2f";
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath();
        ctx.ellipse(enemy.x + enemy.w / 2, enemy.y + enemy.h + 4, enemy.w * 0.55, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.roundRect(enemy.x, enemy.y, enemy.w, enemy.h, 14);
        ctx.fill();
        ctx.fillStyle = "#1c1823";
        const eyeX = enemy.vx > 0 ? enemy.x + enemy.w * 0.64 : enemy.x + enemy.w * 0.28;
        ctx.fillRect(eyeX, enemy.y + 11, 7, 6);
        ctx.fillStyle = "#2d2036";
        for (let i = 0; i < enemy.hp; i++) {
          ctx.fillRect(enemy.x + 7 + i * 10, enemy.y - 10, 7, 4);
        }
      }

      const portalPulse = 0.72 + Math.sin(t * 0.005) * 0.08;
      ctx.fillStyle = "rgba(107, 229, 208, 0.14)";
      ctx.beginPath();
      ctx.ellipse(portal.x + portal.w / 2, portal.y + portal.h / 2, portal.w * portalPulse, portal.h * 0.58, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = crystals.every(c => c.taken) ? "#f3c95b" : sceneMode === "light" ? "#fff7d8" : "#ff7048";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.ellipse(portal.x + portal.w / 2, portal.y + portal.h / 2, portal.w * 0.42, portal.h * 0.48, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#213036";
      ctx.fillRect(portal.x + 4, portal.y + portal.h - 8, portal.w - 8, 18);

      drawProjectiles(t);
      drawFormSwitchBurst();
      drawPlayer(t);
      ctx.restore();
    }

    function drawProjectiles(t) {
      for (const projectile of projectiles) {
        if (projectile.mode !== sceneMode) continue;
        const inLightScene = projectile.scene === "light";
        ctx.save();
        ctx.translate(projectile.x, projectile.y);
        ctx.fillStyle = inLightScene ? "rgba(255, 247, 216, 0.34)" : "rgba(159, 229, 255, 0.26)";
        ctx.beginPath();
        ctx.ellipse(0, 0, 28, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = inLightScene ? "#fff7d8" : "#b7ecff";
        ctx.beginPath();
        ctx.moveTo(projectile.vx > 0 ? 18 : -18, 0);
        ctx.lineTo(projectile.vx > 0 ? -10 : 10, -8);
        ctx.lineTo(projectile.vx > 0 ? -4 : 4, 0);
        ctx.lineTo(projectile.vx > 0 ? -10 : 10, 8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = inLightScene ? "rgba(255, 232, 148, 0.92)" : "rgba(123, 218, 255, 0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(projectile.vx > 0 ? -24 : 24, Math.sin(t * 0.03) * 3);
        ctx.lineTo(projectile.vx > 0 ? 8 : -8, 0);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawFormSwitchBurst() {
      if (formSwitchTimer <= 0) return;
      const p = 1 - formSwitchTimer / 18;
      const cx = player.x + player.w / 2;
      const cy = player.y + player.h / 2;
      const isLightForm = formMode === "light";
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalAlpha = 1 - p;
      if (isLightForm) {
        ctx.strokeStyle = "rgba(255, 247, 216, 0.95)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 26 + p * 74, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 232, 148, 0.28)";
        ctx.beginPath();
        ctx.arc(0, 0, 18 + p * 54, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(255, 74, 36, 0.95)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(0, 18, 34 + p * 80, 12 + p * 22, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(189, 47, 47, 0.3)";
        ctx.beginPath();
        ctx.ellipse(0, 18, 24 + p * 62, 8 + p * 18, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawPlayer(t) {
      const flicker = player.invuln > 0 && Math.floor(t / 80) % 2 === 0;
      if (flicker) return;
      const isLight = formMode === "light";
      ctx.save();
      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
      ctx.scale(player.facing, 1);

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(0, player.h / 2 + 5, 24, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      if (player.dash > 0) {
        ctx.fillStyle = isLight ? "rgba(255, 247, 216, 0.35)" : "rgba(255, 74, 36, 0.28)";
        for (let i = 1; i <= 4; i++) ctx.fillRect(-i * 20, -22, 15, 42);
      }

      if (isLight) {
        ctx.strokeStyle = "rgba(255, 232, 148, 0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, -37, 13, 5, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
        ctx.beginPath();
        ctx.ellipse(-19, -5, 17, 34, -0.55, 0, Math.PI * 2);
        ctx.ellipse(19, -5, 17, 34, 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(214, 176, 89, 0.5)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(-7, -18 + i * 8);
          ctx.quadraticCurveTo(-31, -8 + i * 7, -35, 13 + i * 3);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(7, -18 + i * 8);
          ctx.quadraticCurveTo(31, -8 + i * 7, 35, 13 + i * 3);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "rgba(255, 74, 36, 0.28)";
        ctx.beginPath();
        ctx.moveTo(-6, -18);
        ctx.lineTo(-34, -34);
        ctx.lineTo(-22, 2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(6, -18);
        ctx.lineTo(34, -34);
        ctx.lineTo(22, 2);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = isLight ? "#fff7d8" : "#1a080b";
      ctx.beginPath();
      ctx.roundRect(-15, -22, 30, 44, isLight ? 11 : 6);
      ctx.fill();

      ctx.fillStyle = isLight ? "#e7c468" : "#3a0d0d";
      ctx.fillRect(-10, -28, 20, 16);

      if (isLight) {
        ctx.fillStyle = "#fffdf2";
        ctx.fillRect(4, -22, 5, 5);
        ctx.fillStyle = "#d6b059";
        ctx.fillRect(-11, -1, 22, 5);
      } else {
        ctx.fillStyle = "#ff7048";
        ctx.beginPath();
        ctx.moveTo(-10, -29);
        ctx.lineTo(-20, -41);
        ctx.lineTo(-5, -30);
        ctx.moveTo(10, -29);
        ctx.lineTo(20, -41);
        ctx.lineTo(5, -30);
        ctx.fill();
        ctx.fillRect(5, -22, 5, 5);
        ctx.fillStyle = "#ff7048";
        ctx.fillRect(-11, -1, 22, 5);
        ctx.strokeStyle = "#bd2f2f";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-10, 11);
        ctx.quadraticCurveTo(-34, 24, -16, 32);
        ctx.stroke();
      }

      ctx.fillStyle = isLight ? "#d8c78e" : "#120609";
      ctx.fillRect(-11, -1, 22, 5);
      ctx.fillStyle = isLight ? "#e9dfbe" : "#16080a";
      ctx.fillRect(-12, 20, 8, 14);
      ctx.fillRect(4, 20, 8, 14);

      if (slashTimer > 0) {
        drawMeleeSlash(slashTimer / 18, sceneMode);
      }
      ctx.restore();
    }

    function drawMeleeSlash(progress, scene) {
      const p = Math.max(0, Math.min(1, progress));
      const swing = 1 - p;
      const reach = 38 + swing * 20;
      const lift = -18 + Math.sin(swing * Math.PI) * 10;
      const alpha = Math.max(0, Math.min(1, p * 1.25));
      const hot = scene === "light" ? "255, 232, 148" : "255, 74, 36";
      const core = scene === "light" ? "#fff7d8" : "#ff7048";
      const dark = scene === "light" ? "rgba(214, 176, 89, 0.5)" : "rgba(189, 47, 47, 0.58)";

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(2, 0);
      ctx.rotate(-0.65 + swing * 1.4);

      const blade = ctx.createLinearGradient(8, lift - 26, reach + 22, lift + 32);
      blade.addColorStop(0, `rgba(${hot}, 0)`);
      blade.addColorStop(0.22, `rgba(${hot}, 0.72)`);
      blade.addColorStop(0.58, core);
      blade.addColorStop(1, `rgba(${hot}, 0)`);

      ctx.fillStyle = blade;
      ctx.beginPath();
      ctx.moveTo(14, lift - 18);
      ctx.quadraticCurveTo(reach, lift - 44, reach + 34, lift - 4);
      ctx.quadraticCurveTo(reach - 2, lift + 31, 13, lift + 20);
      ctx.quadraticCurveTo(32, lift + 5, 14, lift - 18);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = `rgba(${hot}, 0.88)`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(18, lift - 9);
      ctx.quadraticCurveTo(reach - 4, lift - 34, reach + 28, lift - 1);
      ctx.stroke();

      ctx.strokeStyle = dark;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(12, lift + 18);
      ctx.quadraticCurveTo(reach - 8, lift + 32, reach + 24, lift + 8);
      ctx.stroke();

      ctx.fillStyle = `rgba(${hot}, 0.55)`;
      for (let i = 0; i < 4; i++) {
        const spark = i * 13 + swing * 18;
        ctx.fillRect(reach - spark, lift + 24 + Math.sin(i + swing * 4) * 8, 10, 3);
      }

      ctx.restore();
    }

    function drawEnvironmentFlash() {
      if (switchTimer <= 0) return;
      const alpha = Math.min(0.72, switchTimer / 22);
      ctx.save();
      ctx.fillStyle = sceneMode === "light"
        ? `rgba(255, 236, 170, ${alpha})`
        : `rgba(30, 20, 58, ${alpha})`;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = sceneMode === "light"
        ? `rgba(255, 247, 216, ${alpha * 0.42})`
        : `rgba(255, 74, 36, ${alpha * 0.46})`;
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 360 * (1 - switchTimer / 24), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawOverlayText() {
      if (messageTimer <= 0) return;
      ctx.save();
      ctx.fillStyle = "rgba(8, 11, 13, 0.55)";
      ctx.roundRect(W / 2 - 178, 34, 356, 38, 6);
      ctx.fill();
      ctx.fillStyle = "#fff7d8";
      ctx.font = "700 17px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(message, W / 2, 59);
      ctx.restore();
    }

    function drawProgress() {
      ctx.save();
      const x = 28;
      const y = H - 34;
      const w = W - 56;
      ctx.fillStyle = "rgba(8, 11, 13, 0.45)";
      ctx.fillRect(x, y, w, 8);
      ctx.fillStyle = sceneMode === "light" ? "#fff7d8" : "#ff7048";
      ctx.fillRect(x, y, w * ((player.x + player.w / 2) / worldWidth), 8);
      ctx.fillStyle = "#f3c95b";
      ctx.fillRect(x + w * (portal.x / worldWidth) - 3, y - 5, 6, 18);
      ctx.restore();
    }

    function loop(now) {
      const elapsed = Math.min(34, now - lastTime);
      lastTime = now;
      if (running && !paused && elapsed >= 0) {
        updatePlayer();
        updateEnemies();
        updateProjectiles();
        updateCamera();
        if (switchTimer > 0) switchTimer -= 1;
      }

      drawBackground(now);
      drawWorld(now);
      drawEnvironmentFlash();
      drawOverlayText();
      drawProgress();

      if (paused) {
        ctx.fillStyle = "rgba(8,11,13,0.55)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff7d8";
        ctx.font = "800 42px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("暂停", W / 2, H / 2);
      }

      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) event.preventDefault();
      if (key === "r") resetGame();
      if (key === "p" && running) {
        paused = !paused;
        updateHud();
      }
      if (!event.repeat && key === " ") {
        switchScene();
      }
      if (!event.repeat && key === "l") switchForm();
      if (!event.repeat && key === "k") jump();
      if (!event.repeat && key === "j") attack();
      if (key === "shift") dash();
      keys.add(key);
    });

    document.addEventListener("keyup", event => {
      keys.delete(event.key.toLowerCase());
    });

    startButton.addEventListener("click", resetGame);
    lightSceneMark.addEventListener("click", () => switchScene("light"));
    shadowSceneMark.addEventListener("click", () => switchScene("shadow"));
    lightFormMark.addEventListener("click", () => switchForm("light"));
    shadowFormMark.addEventListener("click", () => switchForm("shadow"));
    updateHud();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
